services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vyasen}
      POSTGRES_USER: ${POSTGRES_USER:-vyasen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyasen}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vyasen} -d ${POSTGRES_DB:-vyasen}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [vyasen]

volumes:
  postgres-data:
    name: vyasen-postgres-17-data

networks:
  vyasen:
    name: ${DOCKER_NETWORK:-vyasen}
