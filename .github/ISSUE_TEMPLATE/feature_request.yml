name: "💡 Feature Request"
description: "Suggest an idea, enhancement, or new feature for Vyasen."
title: "[Feature]: "
labels: ["enhancement", "feature request", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities in public issues.**
        Please read our [Security Policy](https://github.com/vyasen-org/vyasen/blob/develop/SECURITY.md) and report suspected vulnerabilities privately.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This issue does not disclose a security vulnerability or sensitive security details.
          required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Is this a new feature or an improvement to something existing?
      options:
        - "New Feature"
        - "Enhancement / Improvement to existing feature"
    validations:
      required: true

  - type: checkboxes
    id: category
    attributes:
      label: Which part of the platform is this idea for?
      description: Select all areas this feature would touch.
      options:
        - label: Authentication & Sessions (sign-in, linking accounts)
        - label: Dashboard & Home
        - label: Settings (Appearance, Sidebar, Profile, Notifications)
        - label: Workspace / School Management
        - label: Student / Teacher / Staff roles & permissions
        - label: Attendance, Exams, or Academic features
        - label: Design / Look & Feel
        - label: Developer Experience (DX) / Tooling
        - label: Other
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: What would you like to see added or improved?
      description: Describe your idea and how it should work.
      placeholder: "I would like to suggest..."
    validations:
      required: true

  - type: textarea
    id: examples-mockups
    attributes:
      label: Any examples or mockups?
      description: Attach screenshots, sketches, or link to examples of similar features in other products.
      placeholder: "e.g. Link or screenshot..."

  - type: textarea
    id: why-helpful
    attributes:
      label: Why is this helpful?
      description: Explain why this matters and what benefit it brings to schools, teachers, students, or parents.
      placeholder: "This would help because..."
    validations:
      required: true
